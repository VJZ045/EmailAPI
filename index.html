<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="theme-color" content="#0c1110">
 <title>Contact Us | Northstar Studio</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="page">
   <section class="contact-card" aria-labelledby="page-title">
     <div class="intro">
       <div class="brand-mark" aria-hidden="true">
         <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
           <path d="M4.5 6.75h15A1.75 1.75 0 0 1 21.25 8.5v9A1.75 1.75 0 0 1 19.5 19.25h-15A1.75 1.75 0 0 1 2.75 17.5v-9A1.75 1.75 0 0 1 4.5 6.75Z" />
           <path d="m3.25 8 8.75 6.5L20.75 8" />
         </svg>
       </div>
       <p class="eyebrow">START A CONVERSATION</p>
       <h1 id="page-title">Let's make something good happen.</h1>
       <p class="description">Questions, ideas, or just want to say hello? Send us a note and we'll be in touch soon.</p>
       <div class="reply-note">
         <span class="reply-dot" aria-hidden="true"></span>
         We usually respond within one business day
       </div>
     </div>


     <form id="contact-form" novalidate>
       <div class="field">
         <label for="name">Full name</label>
         <input
           id="name"
           name="from_name"
           type="text"
           autocomplete="name"
           placeholder="Jane Smith"
           maxlength="100"
           required
           aria-describedby="name-error"
         >
         <span class="field-error" id="name-error"></span>
       </div>


       <div class="field">
         <label for="email">Email address</label>
         <input
           id="email"
           name="from_email"
           type="email"
           autocomplete="email"
           placeholder="jane@example.com"
           maxlength="254"
           required
           aria-describedby="email-error"
         >
         <span class="field-error" id="email-error"></span>
       </div>


       <div class="field">
         <label for="subject">Subject</label>
         <input
           id="subject"
           name="subject"
           type="text"
           placeholder="How can we help?"
           maxlength="150"
           required
           aria-describedby="subject-error"
         >
         <span class="field-error" id="subject-error"></span>
       </div>


       <div class="field">
         <label for="message">Message</label>
         <textarea
           id="message"
           name="message"
           rows="5"
           placeholder="Tell us a little about what you have in mind..."
           maxlength="5000"
           required
           aria-describedby="message-error"
         ></textarea>
         <span class="field-error" id="message-error"></span>
       </div>


       <button class="submit-button" id="submit-button" type="submit">
         <span>Send message</span>
         <span aria-hidden="true">↗</span>
       </button>
       <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
     </form>
   </section>
 </main>


 <!-- Official EmailJS browser SDK. It is loaded before the form's JavaScript. -->
 <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
 <script src="script.js"></script>
</body>
</html>
